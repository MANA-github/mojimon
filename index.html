<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もじモン 文字きれい度チェッカー</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header>
    <h1 id="appName"></h1>
    <p id="lead"></p>
  </header>

  <!-- アップロード -->
  <section class="card">
    <div id="drop" tabindex="0">
      <strong>📷 写真をドロップ / クリックして選択</strong>
      <small>スマホならその場で撮影もできます（JPG・PNG など）</small>
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <div class="row">
      <span class="label">サンプルで試す：</span>
      <button id="s1">整った文字</button>
      <button id="s2">ばらばらな文字</button>
    </div>
    <ul class="tips">
      <li>白い紙に<b>横書き</b>で書いた文字がおすすめです（縦書きは未対応）</li>
      <li>文字の部分だけが写るように、真上から明るい場所で撮影してください</li>
      <li>写真はブラウザ内だけで処理され、どこにも送信されません</li>
    </ul>
    <div id="err"></div>
  </section>

  <!-- 結果 -->
  <section class="card" id="result">
    <div class="top">
      <div class="ring">
        <svg width="170" height="170" viewBox="0 0 170 170">
          <circle cx="85" cy="85" r="72" fill="none" stroke="var(--track)" stroke-width="14"/>
          <circle id="arc" cx="85" cy="85" r="72" fill="none" stroke-width="14" stroke-linecap="round"/>
        </svg>
        <div class="num"><b id="score">0</b><span>/ 100 点</span></div>
      </div>
      <div class="verdict">
        <span class="rank" id="rank"></span>
        <h2 id="title"></h2>
        <p id="summary"></p>
      </div>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="advice" id="advice"></div>
    <h3 class="view-title">解析結果</h3>
    <canvas id="view"></canvas>
    <div class="legend">
      <span style="--c:var(--good)">大きさが揃っている文字</span>
      <span style="--c:var(--mid)">少しずれている文字</span>
      <span style="--c:var(--bad)">大きく外れている文字</span>
      <span style="--c:var(--accent2)">行の傾き</span>
    </div>
  </section>

  <footer>※ 画像解析による目安の点数です。文字の大きさ・行のまっすぐさ・間隔・線の太さ・バランスから自動で採点しています。</footer>
</main>

<!-- 読み込み順を変えないでください（config → utils → 解析 → 採点 → 画面） -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/detector.js"></script>
<script src="js/metrics.js"></script>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
